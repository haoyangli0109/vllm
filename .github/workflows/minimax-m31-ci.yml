name: MiniMax-M3.1 CI from PR comment

# Commenting exactly `/ci run` on a PR that targets nho_tracking starts the
# nho2-minimax-m31-ci Buildkite pipeline on the PR head. See
# .buildkite/minimax-m31/README.md on nho_tracking.

on:
  issue_comment:
    types: [created]

concurrency:
  group: minimax-m31-ci-comment-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  trigger:
    if: >-
      github.repository == 'Inferact/nho2' &&
      github.event.issue.pull_request &&
      github.event.comment.body == '/ci run'
    runs-on: ubuntu-latest
    steps:
      - name: Start Buildkite build
        env:
          GH_TOKEN: ${{ github.token }}
          BUILDKITE_API_TOKEN: ${{ secrets.BUILDKITE_MINIMAX_M31_CI_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENTER: ${{ github.event.comment.user.login }}
        run: |
          set -euo pipefail
          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          base="$(jq -r .base.ref <<<"$pr_json")"
          if [[ "$base" != "nho_tracking" ]]; then
            echo "PR #${PR_NUMBER} targets ${base}, not nho_tracking; nothing to do."
            exit 0
          fi
          if [[ "$(jq -r .head.repo.full_name <<<"$pr_json")" != "$GITHUB_REPOSITORY" ]]; then
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --body "MiniMax-M3.1 CI does not run on PRs from forks."
            exit 1
          fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}/reactions" \
            -f content=eyes >/dev/null || true

          sha="$(jq -r .head.sha <<<"$pr_json")"
          request="$(jq -n \
            --arg sha "$sha" \
            --arg branch "$(jq -r .head.ref <<<"$pr_json")" \
            --arg message "$(jq -r .title <<<"$pr_json")" \
            --arg pr "$PR_NUMBER" \
            --arg author "$COMMENTER" \
            '{
              commit: $sha,
              branch: $branch,
              message: $message,
              ignore_pipeline_branch_filters: true,
              env: {MINIMAX_M31_PR_NUMBER: $pr, MINIMAX_M31_TRIGGERED_BY: $author}
            }')"
          build="$(curl -fsS -X POST \
            -H "Authorization: Bearer ${BUILDKITE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$request" \
            https://api.buildkite.com/v2/organizations/inferact/pipelines/nho2-minimax-m31-ci/builds)"
          url="$(jq -r .web_url <<<"$build")"
          echo "Started ${url}"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "Started MiniMax-M3.1 CI on \`${sha:0:12}\` (requested by @${COMMENTER}): ${url}"
